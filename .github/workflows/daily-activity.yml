name: Daily Activity

on:
  workflow_dispatch:
  schedule:
    - cron: "30 18 * * *"
      timezone: "Asia/Kolkata"

permissions:
  contents: write

jobs:
  daily-activity:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create daily activity
        run: |
          echo "Daily activity: $(date '+%Y-%m-%d')" >> activity.log

      - name: Commit activity
        run: |
          git config user.name "shiron986"
          git config user.email "181985784+shiron986@users.noreply.github.com"

          git add activity.log
          git commit -m "Daily activity $(date '+%Y-%m-%d')" || echo "No changes to commit"
          git push
